	<!-- Gallery Popup Script using Magnific Popup -->
	<script>
		$(document).ready(function () {
			// Add click event to all portfolio items using event delegation
			$('.portfolio-wrap-2').on('click', '.img', function (e) {
				e.preventDefault();

				var img = $(this);
				var bgImage = img.css('background-image');
				var src = '';

				console.log('Gallery Item Clicked');
				console.log('Computed background-image:', bgImage);

				// Attempt to extract URL from computed style
				if (bgImage && bgImage !== 'none') {
					src = bgImage.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
				}

				// Fallback: Parsing inline style attribute if computed fails
				if (!src) {
					var style = img.attr('style');
					if (style) {
						var match = style.match(/background-image:\s*url\(['"]?(.*?)['"]?\)/);
						if (match && match[1]) {
							src = match[1];
						}
					}
				}

				console.log('Final Extracted Source:', src);

				if (src) {
					$.magnificPopup.open({
						items: {
							src: src
						},
						type: 'image',
						closeOnContentClick: true,
						closeBtnInside: false,
						mainClass: 'mfp-with-zoom mfp-gallery-rotate',
						image: {
							verticalFit: true
						},
						zoom: {
							enabled: true,
							duration: 300,
							opener: function (element) {
								return img;
							}
						}
					});
				} else {
					console.error('Could not extract image source for popup');
				}
			});
		});
	</script>
